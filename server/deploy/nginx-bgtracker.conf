# bgtracker on a subdomain of a box you already run. Nothing here touches your
# other project's server blocks - it's an additional vhost. Put your other app on
# its own server_name and the two never meet.
#
#   cp deploy/nginx-bgtracker.conf /etc/nginx/sites-available/bgtracker
#   ln -s ../sites-available/bgtracker /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Reads (the stats files) are static and cacheable - put Cloudflare in front of
# this subdomain and the VPS barely sees the traffic no matter how popular it gets.

limit_req_zone $binary_remote_addr zone=bgupload:10m rate=2r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stats.example.com;          # <-- your subdomain

    # ssl_certificate     /etc/letsencrypt/live/stats.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/stats.example.com/privkey.pem;

    # --- reads: the aggregated stats, served straight off disk ---
    location / {
        root /opt/bgtracker/server/out;     # aggregate.py writes here
        default_type application/json;
        gzip_static on;                     # serve the .json.gz twin when the client accepts gzip
        add_header Cache-Control "public, max-age=900";   # 15 min; rebuild is hourly
        try_files $uri =404;
    }

    # --- writes: the only dynamic endpoints, proxied to the ingest process ---
    location = /upload {
        limit_req zone=bgupload burst=10 nodelay;
        client_max_body_size 512k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8787;
    }
}
